name: Daily store offers
on:
  schedule:
    # GitHub often delays or drops scheduled runs, so several back-up slots; the gate runs it once per UK date.
    - cron: '30 23 * * *'  # 00:30 UK (BST)
    - cron: '30 0 * * *'   # 00:30 UK (GMT) / 01:30 BST
    - cron: '30 1 * * *'
    - cron: '30 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: offers, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Only run 00:00-03:59 UK, once per UK date
        id: gate
        run: |
          H=$(TZ=Europe/London date +%H); TODAY=$(TZ=Europe/London date +%F)
          LAST=$(node -e "const d=require('./data/offers.json').updated;console.log(d?new Date(d).toLocaleDateString('en-CA',{timeZone:'Europe/London'}):'')")
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$H" -gt 3 ] || [ "$LAST" = "$TODAY" ]; }; then echo "run=false" >> $GITHUB_OUTPUT; echo "skip (hour $H, last $LAST)"; else echo "run=true" >> $GITHUB_OUTPUT; fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with: { node-version: 20 }
      - run: node tests/progress.test.mjs
        if: steps.gate.outputs.run == 'true'
      - run: node tools/fetch-offers.mjs
        if: steps.gate.outputs.run == 'true'
      - run: node tools/fetch-prices.mjs
        if: steps.gate.outputs.run == 'true'
      - run: node tools/fetch-lidl-prices.mjs
        if: steps.gate.outputs.run == 'true'
      - name: Commit data
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "reta-offers-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/offers.json data/prices.json data/full-prices.json data/lidl-prices.json
          git diff --cached --quiet || (git commit -m "Daily offers $(date -u +%F)" && git pull --rebase && git push)
