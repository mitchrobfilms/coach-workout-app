name: Daily store offers
on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC = 06:00 UK (BST); 05:00 in winter
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: offers, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tests/progress.test.mjs
      - run: node tools/fetch-offers.mjs
      - name: Commit data
        run: |
          git config user.name "reta-offers-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/offers.json data/prices.json
          git diff --cached --quiet || (git commit -m "Daily offers $(date -u +%F)" && git pull --rebase && git push)
