name: Android APK
on:
  workflow_dispatch:
  push:
    tags: ['apk-v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: sudo apt-get install -y imagemagick >/dev/null
      - name: Build
        env: { VERSION_CODE: '${{ github.run_number }}', APP_VERSION: '1.0.${{ github.run_number }}' }
        run: bash android-build/build.sh
      - name: Sign (key from repo secrets, never printed)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e; umask 077; echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.p12"
          BT=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -1)
          U=android-build/work/android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -f -p 4 "$U" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.p12" --ks-type PKCS12 --ks-pass env:KS_PASS --ks-key-alias glp1life --out GLP1-Life.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs GLP1-Life.apk | grep -i 'SHA-256'
          rm -f "$RUNNER_TEMP/ks.p12"
      - uses: actions/upload-artifact@v4
        with: { name: GLP1-Life-apk, path: GLP1-Life.apk }
      - name: Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          TAG=apk-v1.0.${{ github.run_number }}
          gh release create "$TAG" GLP1-Life.apk --title "GLP1 Life Android 1.0.${{ github.run_number }}" --notes "Signed APK for private testing. Install: download on your Android phone, allow 'Install unknown apps' for your browser, open the file." --latest || gh release upload "$TAG" GLP1-Life.apk --clobber
          true
